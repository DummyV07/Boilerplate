services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fullstack-template-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/template.db
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fullstack-template-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
